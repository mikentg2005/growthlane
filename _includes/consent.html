<div class="consent" id="consent" role="region" aria-labelledby="consent-title" hidden>
  <div class="consent-inner">
    <div class="consent-text">
      <p class="consent-title" id="consent-title">Cookies for statistics</p>
      <p>I'd like to use Google Analytics cookies to see which articles get read. They are only set if you accept. Declining changes nothing about the site. <a href="{{ '/privacy-policy/' | relative_url }}">Privacy policy</a></p>
    </div>
    <div class="consent-actions">
      <button type="button" class="btn btn--ghost" data-consent="denied">Decline</button>
      <button type="button" class="btn btn--ghost" data-consent="granted">Accept</button>
    </div>
  </div>
</div>
<script>
(function () {
  var GA_ID = '{{ site.google_analytics }}', KEY = 'gl_consent';
  var box = document.getElementById('consent');
  function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function write(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function loadAnalytics() {
    if (window.__glAnalytics) return;
    window.__glAnalytics = true;
    window['ga-disable-' + GA_ID] = false;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
    gtag('js', new Date());
    gtag('config', GA_ID);
  }
  function clearAnalytics() {
    window['ga-disable-' + GA_ID] = true;
    var host = location.hostname;
    document.cookie.split(';').forEach(function (c) {
      var name = c.split('=')[0].trim();
      if (name === '_ga' || name.indexOf('_ga_') === 0) {
        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + host;
      }
    });
  }
  function choose(v) {
    write(v);
    box.hidden = true;
    if (v === 'granted') loadAnalytics(); else clearAnalytics();
  }
  var saved = read();
  if (saved === 'granted') loadAnalytics();
  else if (saved !== 'denied') box.hidden = false;
  box.addEventListener('click', function (e) {
    var b = e.target.closest('[data-consent]');
    if (b) choose(b.getAttribute('data-consent'));
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-cookie-settings]')) {
      box.hidden = false;
      box.querySelector('button').focus();
    }
  });
})();
</script>
