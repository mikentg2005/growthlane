{% if site.mailerlite.account and site.mailerlite.form %}
<aside class="newsletter" aria-labelledby="nl-title" data-account="{{ site.mailerlite.account }}" data-form="{{ site.mailerlite.form }}">
  <div class="newsletter-text">
    <p class="newsletter-title" id="nl-title">New reviews by email</p>
    <p>One short email when a new article is published. Optional: everything on this site stays open without signing up.</p>
  </div>
  <div class="newsletter-action">
    <button type="button" class="btn btn--primary newsletter-open">Get the emails</button>
    <p class="newsletter-note">Opens a signup form from our email provider, MailerLite. <a href="{{ '/privacy-policy/' | relative_url }}">Privacy policy</a></p>
  </div>
  <div class="newsletter-form" hidden></div>
</aside>
<script>
(function () {
  document.querySelectorAll('.newsletter').forEach(function (box) {
    var btn = box.querySelector('.newsletter-open');
    var holder = box.querySelector('.newsletter-form');
    btn.addEventListener('click', function () {
      var account = box.getAttribute('data-account'), form = box.getAttribute('data-form');
      holder.innerHTML = '<div class="ml-embedded" data-form="' + form + '"></div>';
      holder.hidden = false;
      box.querySelector('.newsletter-action').hidden = true;
      if (!window.__glMailerLite) {
        window.__glMailerLite = true;
        (function (w, d, e, u, f, l, n) {
          w[f] = w[f] || function () { (w[f].q = w[f].q || []).push(arguments); };
          l = d.createElement(e); l.async = 1; l.src = u;
          n = d.getElementsByTagName(e)[0]; n.parentNode.insertBefore(l, n);
        })(window, document, 'script', 'https://assets.mailerlite.com/js/universal.js', 'ml');
        ml('account', account);
      }
    });
  });
})();
</script>
{% endif %}
